name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (auto = release if signing secrets exist, otherwise debug)'
        type: choice
        default: auto
        options: [auto, debug, release]
      publish_nightly:
        description: 'Publish result as nightly prerelease'
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_type:
        description: 'Build type (auto = release if signing secrets exist, otherwise debug)'
        type: string
        default: auto
      publish_nightly:
        description: 'Publish result as nightly prerelease'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed only for nightly prerelease publishing

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # web module preBuild runs `pnpm run build`, Node + pnpm are required
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare Google Services config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            # Dummy config so the google-services plugin can run without real Firebase credentials
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "rikkahub-dummy",
              "storage_bucket": "rikkahub-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDUMMY_KEY_FOR_CI_BUILD_0000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000000000001",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDUMMY_KEY_FOR_CI_BUILD_0000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Prepare signing config and decide build type
        id: signing
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          INPUT_BUILD_TYPE: ${{ inputs.build_type || 'auto' }}
        run: |
          build_type="$INPUT_BUILD_TYPE"
          if [ "$build_type" = "auto" ] || [ "$build_type" = "release" ]; then
            if [ -n "$KEY_BASE64" ] && [ -n "$SIGNING_CONFIG" ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s' "$KEY_BASE64" | base64 -d > app/app.key
              printf '%s' "$SIGNING_CONFIG" > local.properties
              build_type="release"
            elif [ "$build_type" = "release" ]; then
              echo "::error::Release build requires KEY_BASE64, SIGNING_CONFIG and GOOGLE_SERVICES_JSON secrets"
              exit 1
            else
              echo "No signing secrets found, falling back to debug build"
              build_type="debug"
            fi
          fi
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          BUILD_TYPE: ${{ steps.signing.outputs.build_type }}
        run: |
          chmod +x gradlew
          ./gradlew "assemble$(echo "$BUILD_TYPE" | sed 's/^./\U&/')"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-${{ steps.signing.outputs.build_type }}-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish nightly prerelease
        if: inputs.publish_nightly == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          body: |
            自动构建（commit `${{ github.sha }}`）

            > ⚠️ 开发版本，可能不稳定，仅供测试。
          files: app/build/outputs/apk/**/*.apk
